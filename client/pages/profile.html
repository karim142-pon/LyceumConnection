<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Профиль — LyceumConnection</title>

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self';
script-src 'self';
style-src 'self' 'unsafe-inline';
img-src 'self' data:;
connect-src 'self' http://localhost:3000 http://127.0.0.1:3000;
object-src 'none';
base-uri 'self';
form-action 'self';
">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/profile.css">

</head>

<body>

<header class="navbar">

    <div class="nav-left">

        <button id="backButton" class="back-button">
            <icon name=arrow-left inline/>
            <span>Назад</span>
        </button>

    </div>

    <div class="logo">
        LC
    </div>

</header>

<main class="profile-page">

<section class="profile-header fade-in">

<div class="cover"></div>

<div class="profile-info">

    <div id="profileAvatar" class="profile-avatar">

        <img
            id="profileAvatarImage"
            class="avatar-image hidden"
            alt="Аватар">

        <span id="profileAvatarLetter">
            LC
        </span>

        <input
            id="avatarInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            hidden>

    </div>

    <div class="profile-text">

        <h1 id="profileName">
            Загрузка...
        </h1>

        <div class="username-pill">

            <icon name=circle-user color=info/>

            <span id="profileUsername">
                @username
            </span>

        </div>

        <p id="profileBio">
            Биография пока не заполнена.
        </p>

        <div class="joined-info">

            <icon name=calendar color=secondary/>

            <span id="profileJoined">
                На платформе
            </span>

        </div>

    </div>

    <button
        id="editProfileButton"
        class="edit-profile-button">

        <icon name=edit inline/>

        Редактировать профиль

    </button>

</div>

</section>

<section class="profile-stats fade-up">

    <div class="stat-card">

        <span id="postsCount">0</span>

        <p>Публикации</p>

    </div>

    <div class="stat-card">

        <span id="friendsCount">0</span>

        <p>Друзья</p>

    </div>

    <div class="stat-card">

        <span id="likesCount">0</span>

        <p>Получено лайков</p>

    </div>

</section>

<section class="profile-posts fade-up">

<h2>Мои публикации</h2>

<div id="userPostsContainer">

<p class="loading-text">

Загрузка публикаций...

</p>

</div>

</section>

</main>

<!-- =========================================
     Модальное окно редактирования профиля
========================================= -->

<div id="editModal" class="modal hidden">

    <div class="modal-content profile-modal">

        <button id="closeEditModal" class="close-button">
            ×
        </button>

        <h2>Редактировать профиль</h2>

        <form id="editProfileForm">

            <label>
                Имя

                <input
                    id="editFirstName"
                    type="text"
                    maxlength="50"
                    required>
            </label>

            <label>
                Фамилия

                <input
                    id="editLastName"
                    type="text"
                    maxlength="50"
                    required>
            </label>

            <label>
                Биография

                <textarea
                    id="editBio"
                    maxlength="120"
                    rows="5"></textarea>
            </label>

            <div class="modal-footer">

                <span id="bioCounter">
                    0 / 300
                </span>

                <button
                    class="primary-button"
                    type="submit">

                    Сохранить

                </button>

            </div>

        </form>

    </div>

</div>

<script type="module"
        src="../js/profile.js"></script>

</body>

</html>
