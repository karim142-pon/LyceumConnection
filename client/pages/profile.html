<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Профиль — LyceumConnection</title>

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self';
script-src 'self';
style-src 'self' 'unsafe-inline';
img-src 'self' data:;
connect-src 'self' http://localhost:3000 http://127.0.0.1:3000;
object-src 'none';
base-uri 'self';
form-action 'self';
">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/profile.css">

</head>

<body>

<header class="navbar">

<div class="nav-left">

<div class="logo">
LC
</div>

<h2>LyceumConnection</h2>

</div>

<div class="nav-right">

<button id="backButton"
        class="icon-button">

Назад

</button>

</div>

</header>

<main class="profile-page">

<section class="profile-header fade-in">

<div class="cover"></div>

<div class="profile-info">

<div id="profileAvatar"
     class="profile-avatar">

<img
    id="profileAvatarImage"
    class="avatar-image hidden"
    alt="Аватар">

<span id="profileAvatarLetter">
LC
</span>

<input
    id="avatarInput"
    type="file"
    accept="image/png,image/jpeg,image/webp"
    hidden>

</div>

<div class="profile-text">

<h1 id="profileName">
Загрузка...
</h1>

<p id="profileUsername">
@username
</p>

<p id="profileBio">
Биография пока не заполнена.
</p>

<p id="profileJoined"
   class="joined-date">

Дата регистрации

</p>

</div>

<button id="editProfileButton"
        class="primary-button">

Редактировать профиль

</button>

</div>

</section>

<section class="profile-posts fade-up">

<h2>Мои публикации</h2>

<div id="userPostsContainer">

<p class="loading-text">

Загрузка публикаций...

</p>

</div>

</section>

</main>

<!-- =========================================
     Модальное окно редактирования профиля
========================================= -->

<div id="editModal" class="modal hidden">

    <div class="modal-content profile-modal">

        <button id="closeEditModal" class="close-button">
            ×
        </button>

        <h2>Редактировать профиль</h2>

        <form id="editProfileForm">

            <label>
                Имя

                <input
                    id="editFirstName"
                    type="text"
                    maxlength="50"
                    required>
            </label>

            <label>
                Фамилия

                <input
                    id="editLastName"
                    type="text"
                    maxlength="50"
                    required>
            </label>

            <label>
                Биография

                <textarea
                    id="editBio"
                    maxlength="300"
                    rows="5"></textarea>
            </label>

            <div class="modal-footer">

                <span id="bioCounter">
                    0 / 300
                </span>

                <button
                    class="primary-button"
                    type="submit">

                    Сохранить

                </button>

            </div>

        </form>

    </div>

</div>

<script type="module"
        src="../js/profile.js"></script>

</body>

</html>
