<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Профиль — LyceumConnection</title>

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self';
script-src 'self';
style-src 'self' 'unsafe-inline';
img-src 'self' data:;
connect-src 'self' http://localhost:3000 http://127.0.0.1:3000;
object-src 'none';
base-uri 'self';
form-action 'self';
">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/profile.css">

</head>

<body>

<header class="navbar">

<div class="nav-left">

<div class="logo">
LC
</div>

<h2>LyceumConnection</h2>

</div>

<div class="nav-right">

<button id="backButton"
        class="icon-button">

Назад

</button>

</div>

</header>

<main class="profile-page">

<section class="profile-header fade-in">

<div class="cover"></div>

<div class="profile-info">

<div id="profileAvatar"
     class="profile-avatar">

LC

</div>

<div class="profile-text">

<h1 id="profileName">
Загрузка...
</h1>

<p id="profileUsername">
@username
</p>

<p id="profileBio">
Биография пока не заполнена.
</p>

<p id="profileJoined"
   class="joined-date">

Дата регистрации

</p>

</div>

<button id="editProfileButton"
        class="primary-button">

Редактировать профиль

</button>

</div>

</section>

<section class="profile-posts fade-up">

<h2>Мои публикации</h2>

<div id="userPostsContainer">

<p class="loading-text">

Загрузка публикаций...

</p>

</div>

</section>

</main>

<script type="module"
        src="../js/profile.js"></script>

</body>

</html>
